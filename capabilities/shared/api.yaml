          in: query
          type: string
          required: false
          description: The state the pipe is in.
        - name: DesiredState
          in: query
          type: string
          required: false
          description: The state the pipe should be in.
        - name: Limit
          in: query
          type: integer
          required: false
          description: The maximum number of pipes to include in the response.
        - name: NamePrefix
          in: query
          type: string
          required: false
          description: 'A value that will return a subset of the pipes associated with this account. For example, <code>"NamePrefix": "ABC"</code> will return all endpoints with "ABC" in the name.'
