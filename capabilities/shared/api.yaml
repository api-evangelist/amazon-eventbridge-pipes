          in: query
          type: string
          required: false
          description: 'If <code>nextToken</code> is returned, there are more results available. The value of <code>nextToken</code> is a unique pagination token for each page. Make the call again using
            the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours. Using an expired pagination token will return an HTTP 400 InvalidToken
            error.'
        - name: SourcePrefix
          in: query
          type: string
          required: false
          description: The prefix matching the pipe source.
        - name: TargetPrefix
          in: query
          type: string
          required: false
          description: The prefix matching the pipe target.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
